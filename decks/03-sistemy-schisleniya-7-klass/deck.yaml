# ============================================================
#  7 класс: системы счисления
#  Сборка: python3 scripts/build.py decks/03-sistemy-schisleniya-7-klass --formats pptx
# ============================================================

meta:
  title: "Системы счисления"
  subtitle: "Как считать в двоичной, восьмеричной и шестнадцатеричной системе"
  subject: "Информатика"
  audience: school
  org: "7 класс"
  date: "2026"
  formats: [pptx]
  slug: "sistemy-schisleniya-7-klass"

slides:
  - layout: title

  - layout: bullets
    title: "Что такое система счисления"
    kicker: "Определение"
    lead: "Система счисления — это способ записи чисел с помощью цифр."
    bullets:
      - text: "Основание — сколько разных цифр используется в системе."
      - text: "В десятичной системе 10 цифр: от 0 до 9."
      - text: "В двоичной — 2 цифры: 0 и 1."
      - text: "В восьмеричной — 8 цифр: от 0 до 7."
      - text: "В шестнадцатеричной — 16 цифр: 0–9 и A–F."
    note: "Позиция цифры важна: в числе 555 три пятёрки означают разное."
    notes: >-
      [проверено 2026-11-06] Основания 2, 8, 10, 16. В шестнадцатеричной
      системе A = 10, B = 11, ..., F = 15.

  - layout: cards
    title: "Где встречаются системы счисления"
    kicker: "Вокруг нас"
    lead: "Привычная десятичная — не единственная."
    cards:
      - number: "1"
        title: "Десятичная"
        text: "Счёт в быту: деньги, оценки, номера домов."
      - number: "2"
        title: "Двоичная"
        text: "Компьютеры: биты, транзисторы, «включено / выключено»."
      - number: "3"
        title: "Шестнадцатеричная"
        text: "Цвета #FF00AA, адреса памяти, коды символов."
    notes: >-
      [проверено 2026-11-06] Цвет в CSS записывается как #RRGGBB в
      шестнадцатеричной системе; 4 бита = 1 шестнадцатеричная цифра.

  - layout: image
    title: "Разряды двоичного числа"
    kicker: "Наглядно"
    image: "assets/radix-1011.png"
    caption: "1011 (в двоичной) = 1·8 + 0·4 + 1·2 + 1·1 = 11 (в десятичной)"
    notes: "[проверено 2026-11-06] 1011 (дв.) = 8 + 0 + 2 + 1 = 11 (дес.)."

  - layout: table
    title: "Основания и цифры"
    kicker: "Сравнение"
    columns: ["Система", "Основание", "Цифры"]
    column_widths: [1.6, 1.0, 2.0]
    rows:
      - ["Двоичная", "2", "0, 1"]
      - ["Восьмеричная", "8", "0–7"]
      - ["Десятичная", "10", "0–9"]
      - ["Шестнадцатеричная", "16", "0–9, A–F"]
    notes: >-
      [проверено 2026-11-06] В шестнадцатеричной системе используются цифры
      0–9 и буквы A–F: A = 10, B = 11, C = 12, D = 13, E = 14, F = 15.

  - layout: image
    title: "Как считают в двоичной системе"
    kicker: "Счёт"
    image: "assets/count-binary.png"
    caption: "После 1 цифры заканчиваются — появляется новый разряд: 10, 11, 100, 101…"
    notes: "[проверено 2026-11-06] 0, 1, 10, 11, 100, 101, 110, 111 — двоичная запись чисел 0–7; после 1 добавляется новый разряд."

  - layout: steps
    title: "Как перевести из десятичной в двоичную"
    kicker: "Алгоритм"
    steps:
      - title: "Делите на 2"
        text: "Записывайте целое частное и остаток."
      - title: "Повторяйте"
        text: "Делите частное, пока оно не станет равно 0."
      - title: "Соберите остатки"
        text: "Читайте их снизу вверх — это и есть ответ."
      - title: "Проверьте"
        text: "Сложите степени двойки — получите исходное число."
    notes: >-
      [проверено 2026-11-06] Для 13: 13 ÷ 2 = 6 (ост. 1), 6 ÷ 2 = 3 (ост. 0),
      3 ÷ 2 = 1 (ост. 1), 1 ÷ 2 = 0 (ост. 1). Остатки снизу вверх: 1101.

  - layout: image
    title: "Деление в столбик: 13 → 1101"
    kicker: "Пример"
    image: "assets/division-13.png"
    caption: "Остатки читаем снизу вверх: 1, 0, 1, 1 → 1101 (в двоичной)"
    notes: >-
      [проверено 2026-11-06] 13 ÷ 2 = 6 (ост. 1), 6 ÷ 2 = 3 (ост. 0),
      3 ÷ 2 = 1 (ост. 1), 1 ÷ 2 = 0 (ост. 1). Остатки снизу вверх: 1101.

  - layout: table
    title: "Те же шаги в таблице"
    kicker: "Сводка"
    columns: ["Деление", "Частное", "Остаток"]
    column_widths: [1.6, 1.0, 1.0]
    rows:
      - ["13 ÷ 2", "6", "1"]
      - ["6 ÷ 2", "3", "0"]
      - ["3 ÷ 2", "1", "1"]
      - ["1 ÷ 2", "0", "1"]
    notes: >-
      [проверено 2026-11-06] Остатки: 1, 0, 1, 1. Читаем снизу вверх:
      1101 (дв.). Проверка: 8 + 4 + 0 + 1 = 13.

  - layout: image
    title: "Обратный перевод: 1101 (дв.)"
    kicker: "Проверка"
    image: "assets/radix-1101.png"
    caption: "1101 (в двоичной) = 1·8 + 1·4 + 0·2 + 1·1 = 13 (в десятичной)"
    notes: "[проверено 2026-11-06] 1101 (дв.) = 8 + 4 + 0 + 1 = 13 (дес.)."

  - layout: two-col
    title: "Двоичная и шестнадцатеричная"
    kicker: "Сравнение"
    left:
      heading: "Двоичная"
      bullets:
        - "Только 0 и 1."
        - "Длинная запись: 1101 0010."
        - "Удобна для компьютера."
    right:
      heading: "Шестнадцатеричная"
      bullets:
        - "16 цифр: 0–9 и A–F."
        - "4 бита = 1 цифра 16-ричной системы."
        - "Короткая запись: D2."
    notes: >-
      [проверено 2026-11-06] 1101 0010 (дв.) = D2 (шестн.); 4 бита дают
      16 комбинаций, поэтому одна hex-цифра заменяет 4 бита.

  - layout: bullets
    title: "Частые ошибки"
    kicker: "Внимание"
    bullets:
      - text: "Писать 2 в двоичной записи: такой цифры нет."
      - text: "Читать остатки сверху вниз: правильно — снизу вверх."
      - text: "Забывать основание: 10 в двоичной и 10 в десятичной — разные числа."
      - text: "Считать A за 11: A = 10, B = 11, ..., F = 15."
      - text: "Путать число и его запись: 1101 — это запись, а не «тысяча сто один»."
    note: "Проверяйте перевод сложением степеней основания."
    notes: >-
      [проверено 2026-11-06] В двоичной системе нет цифры 2; A = 10, F = 15.
      10 (дв.) = 2 (дес.), а 10 (дес.) = 1010 (дв.).

  - layout: bullets
    title: "Проверьте себя"
    kicker: "Практика"
    bullets:
      - text: "Переведите 25 из десятичной системы в двоичную."
      - text: "Переведите 1010 из двоичной системы в десятичную."
      - text: "Запишите число 15 в шестнадцатеричной системе."
      - text: "Сколько бит содержит одна шестнадцатеричная цифра?"
    note: "Решите в тетради, затем проверим вместе."
    notes: >-
      [проверено 2026-11-06] 25 = 16 + 8 + 1 = 11001 (дв.); 1010 (дв.) = 10;
      15 = F (шестн.); 4 бита = 1 hex-цифра.

  - layout: summary
    title: "Опорный конспект"
    kicker: "Повторение"
    dark: true
    columns:
      - heading: "Понятия"
        items:
          - "Система счисления — способ записи чисел."
          - "Основание — число цифр в системе."
          - "Позиция важна: вес разряда зависит от места."
      - heading: "Перевод"
        items:
          - "Из десятичной: делить на основание, остатки снизу вверх."
          - "В десятичную: цифра × степень основания, сложить."
          - "Проверка: выполнить обратный перевод."
      - heading: "Примеры"
        items:
          - "1011 (дв.) = 11 (дес.)."
          - "13 (дес.) = 1101 (дв.)."
          - "4 бита = 1 цифра 16-ричной системы."
    note: "Основание задаёт, сколько цифр используется и какие веса у разрядов."
    notes: >-
      [проверено 2026-11-06] Примеры проверены делением и сложением степеней
      основания; 4 бита = 16 комбинаций = 1 hex-цифра.
