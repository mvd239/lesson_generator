# ============================================================
#  Защита проекта: система агентов для учебных материалов
#  Сборка: python3 scripts/build.py decks/05-zashchita-proekta --formats pdf
# ============================================================

meta:
  title: "Генерация учебных материалов системой агентов"
  subtitle: "Презентации и проверочные тесты к урокам со сверкой с ФРП"
  subject: "Защита проекта"
  org: "Информатика · 7–11 классы"
  date: "2026"
  formats: [pdf]
  slug: "zashchita-proekta"

slides:
  - layout: title

  - layout: bullets
    title: "Задача: из темы и класса — готовые материалы"
    kicker: "Постановка задачи · что"
    lead: "Вход — тема и класс. Выход — готовый файл, а не черновик «доделать руками»."
    bullets:
      - "Презентация урока: PPTX, PDF или HTML — один формат за сборку."
      - "Викторина «термин ↔ определение»: один index.html, офлайн."
      - "Сверка с ФРП: какие темы класса раскрыты, что чужое."
      - "Иллюстрации из YAML-описаний: схемы, массивы, деревья, логика."
      - "Единое оформление: тема в theme.yaml применяется ко всем материалам."
    note: "Три агента: диспетчер собирает заказ, два профильных — делают."
    notes: >-
      Система — конвейер, а не чат: на выходе файл, который можно сразу
      показывать на уроке. [проверено 2026-11-07] Четыре примера в decks/
      собираются командой build.py без ошибок.

  - layout: bullets
    title: "Зачем: ручная вёрстка и «уплывающая» программа"
    kicker: "Постановка задачи · зачем и почему"
    bullets:
      - "Учитель тратит часы на оформление слайдов вместо методики."
      - "Универсальные ИИ-генераторы не знают программу: материал уходит в другой класс."
      - "Языковые модели галлюцинируют: факты, формулы, даты, код."
      - "Агенты и скиллы: этап работы закреплён за ролью, роль — за инструкцией."
      - text: "Воспроизводимость: исходник — YAML, пересборка даёт тот же файл."
        strong: "Воспроизводимость"
    note: "Одна команда вместо вечера за PowerPoint; сверка с ФРП — до сдачи, а не после замечаний."
    notes: >-
      Ключевая идея: не «попроси нейросеть написать слайды», а провести материал
      через контролируемый конвейер с проверками. Роли разделены, чтобы каждый
      этап имел свой чек-лист и свою зону ответственности.

  - layout: image
    title: "Архитектура: диспетчер, агенты, материалы"
    kicker: "Как устроено"
    image: "assets/architecture.png"
    caption: "14 скиллов ведут этапы: бриф → контент → дизайн → факты → ФРП → сборка"
    notes: >-
      Диспетчер сам ничего не делает: уточняет заказ и передаёт профильному агенту
      готовой командой. presentation-maker ведёт презентации, lesson-game-builder —
      викторины. Материал проходит этапы под контролем скиллов, на выходе — файлы.
      Как именно устроены агенты и скиллы — на следующем слайде.

  - layout: table
    title: "Структура проекта: агенты и скиллы"
    kicker: "Как устроено"
    columns: ["Элемент", "Что делает", "Результат"]
    column_widths: [1.5, 2.3, 1.9]
    rows:
      - ["Диспетчер lesson-studio", "выясняет продукт, собирает тему и класс", "готовая команда агенту"]
      - ["Агент presentation-maker", "план, текст, оформление, иллюстрации", "презентация PPTX / PDF / HTML"]
      - ["Агент lesson-game-builder", "пары «термин ↔ определение», интерфейс", "викторина — один index.html"]
      - ["9 скиллов презентаций", "этапы: бриф, контент, дизайн, факты, ФРП", "контроль качества каждого шага"]
      - ["5 скиллов викторин", "контент, контракт игры, UI, приёмка", "игра проходит QA до сдачи"]
    note: "Скилл — файл-инструкция: у этапа свой чек-лист и свои запреты."
    notes: >-
      Скилл загружается агентом на своём этапе и держит правила: что спросить,
      что проверить, что запретить. 14 скиллов: 9 для презентаций, 5 для викторин.

  - layout: table
    title: "Метрики и методика оценки"
    kicker: "Тестирование · метрики"
    columns: ["Метрика", "Как считаем", "Результат"]
    column_widths: [1.5, 2.3, 1.9]
    rows:
      - ["Успешность генерации", "прогон запросов: файл без повтора", "5 презентаций: 4 с первого раза"]
      - ["Соответствие ФРП", "скрипт-сверка и чек-лист методиста", "90 тем; чужое помечено"]
      - ["Фактическая точность", "статус «проверено / спорно» в notes", "каждый факт с источником"]
      - ["Работоспособность игры", "автоскрипт qa-verify и приёмка", "7 групп; офлайн, без CDN"]
      - ["Время подготовки", "хронометраж «запрос → файл»", "одна команда — минуты"]
      - ["Опасные запросы", "набор некорректных запросов", "отказ или уточнение"]
    note: "Считаем числом запросов, а не процентами: выборка пока мала."
    notes: >-
      Слайд объединяет уровни проверки и цифры. Вёрстка: 0 предупреждений «!»
      на четырёх примерах, валидацию --check проходят все. [проверено 2026-11-07]
      Цифры — запуском build.py и check_frp.py по всем примерам. Регрессионные
      тесты рендереров — в плане развития.

  - layout: code
    title: "Сверка с ФРП: отчёт конвейера"
    kicker: "Нормативы · ФРП"
    language: консоль
    code: |
      $ python3 scripts/check_frp.py decks/01-algebra-logiki

      Теоретические основы информатики
        + Логические высказывания и операции
            слайды 2, 3, 4, 5, 7, 8, 10
        + Таблицы истинности и законы — слайды 3, 5, 7, 9
        + Логические элементы — слайд 6
        · Системы счисления — не раскрыто

      Итог: раскрыто 3 из 14 тем класса.
    note: "В отчёте стоит галочка; здесь она заменена на «+» для совместимости шрифта."
    notes: >-
      [проверено 2026-11-07] Вывод реального запуска; строки со слайдами
      перенесены ради ширины. Для одного урока «3 из 14» — хороший результат:
      остальные темы класса ждут своих уроков.

  - layout: bullets
    title: "ФРП учитываем на каждом шаге"
    kicker: "Нормативы · ФРП"
    bullets:
      - "Первоисточники в репозитории: ФРП 2025, 7–11 классы, углублённый уровень (PDF)."
      - text: "topics.yaml: 90 тем с ключевыми словами — машиночитаемая выжимка."
        strong: "topics.yaml"
      - "Сверка — обычный скрипт, не языковая модель: результат воспроизводим."
      - "Класс берётся из meta.grade, текст слайдов сопоставляется с темами."
      - text: "Ловит чужой класс: «Системы счисления — по ФРП это 8, 10 класс»."
        strong: "Ловит чужой класс"
      - "Ограничения честные: поиск по словам, не по смыслу; финал — за методистом."
    note: "Сверка встроена в цикл агента: сначала check_frp, потом сборка и сдача."
    notes: >-
      [проверено 2026-11-07] Запуск по всем примерам: deck 03 пометил системы
      счисления (8, 10 классы), deck 04 — деревья и подпрограммы (9 класс).
      Скрипт не блокирует сборку: он отчёт, а решение — за учителем и методистом.

  - layout: image
    title: "Как это работает сейчас"
    kicker: "Демонстрация"
    image: "assets/demo-qr.png"
    caption: "Наведите камеру: слева — интерактивная викторина, справа — папка с материалами"
    notes: >-
      Приложение — один файл: открывается в браузере с телефона, работает офлайн,
      без CDN и без сбора данных учеников. Материалы — собранные презентации и
      игры по четырём темам. QR-коды сейчас заглушки — заменить перед защитой.
      Если спросят про безопасность: персональных данных нет, права агента
      ограничены, проверки выполняет код, а не модель.

  - layout: image
    title: "Материалы в трёх форматах"
    kicker: "Демонстрация"
    image: "assets/shots.png"
    caption: "Места под скриншоты: заменить на снимки готовых материалов"
    notes: >-
      Показать по скриншоту на каждый формат: PPTX открывается в Р7/МойОфис,
      PDF одинаково выглядит везде, HTML-игра работает с телефона. Скриншоты
      снять из dist/ перед защитой и вставить в assets/shots.yaml рамки.

  - layout: team
    title: "Состав команды"
    kicker: "Команда"
    people:
      - name: "Богданов Алексей"
      - name: "Петраневская Мария"
      - name: "Антипова Ольга"
      - name: "Гилев Андрей"
      - name: "Веселова Наталья"
    links:
      - title: "Материалы агента"
        label: "QR — заглушка"
      - title: "Интерактивное приложение"
        label: "QR — заглушка"
    notes: >-
      Представить команду. Текст на слайде редактируется: имена — текстовые поля,
      круги и рамки QR можно заменить фото и картинками прямо в PowerPoint.
      QR-коды сейчас заглушки — заменить на ссылки на папку материалов и
      на интерактивное приложение.
