meta:
  title: "Рекурсия"
  subtitle: "Функция, которая вызывает себя: база, шаг и Python"
  subject: "Информатика"
  audience: school
  grade: 10
  level: advanced
  org: "10 класс"
  date: "2026"
  formats: [pdf]
  slug: "recursion-10-klass"

slides:
  - layout: title

  - layout: bullets
    title: "Что такое рекурсия"
    kicker: "Определение"
    lead: "Рекурсия — приём, когда функция вызывает саму себя."
    bullets:
      - text: "Каждый вызов — новая копия функции со своим значением параметра."
      - text: "Примеры из жизни: матрёшка, дерево папок, фрактал."
      - text: "В математике: factorial(n) = n · factorial(n − 1)."
      - text: "В Python функция вызывает себя по имени."
    note: "Главное: из рекурсии обязательно должен быть выход."
    notes: >-
      [проверено 2026-11-07] Определение рекурсии и примеры; каждый вызов
      создаёт новый кадр стека со своим значением параметра.

  - layout: cards
    title: "Три обязательные части"
    kicker: "Правило"
    lead: "Без любой из трёх частей рекурсия не работает."
    cards:
      - number: "1"
        title: "База"
        text: "Условие, при котором функция не вызывает себя. Без базы — RecursionError."
      - number: "2"
        title: "Шаг"
        text: "Параметр меняется и приближается к базе: n → n − 1."
      - number: "3"
        title: "Вызов"
        text: "Функция вызывает себя с новым параметром и возвращает результат."
    notes: >-
      [проверено 2026-11-07] База, изменение параметра и рекурсивный вызов —
      минимальный набор для завершаемой рекурсии.

  - layout: code
    title: "Структура функции в Python"
    kicker: "Повторение"
    language: python
    code: |
      def area(a, b):        # def имя(параметры)
          result = a * b     # тело функции
          return result      # возврат значения

      s = area(3, 4)         # вызов
      print(s)               # 12
    note: "def → параметры → тело → return → вызов."
    notes: >-
      [проверено 2026-11-07] Код запущен в CPython: area(3, 4) возвращает 12.

  - layout: code
    title: "Факториал: база и шаг"
    kicker: "Пример"
    language: python
    code: |
      def factorial(n):
          if n <= 1:                    # база
              return 1
          return n * factorial(n - 1)   # шаг

      print(factorial(5))               # 120
    note: "Параметр n уменьшается на 1 — рекурсия движется к базе."
    notes: >-
      [проверено 2026-11-07] Код запущен в CPython: factorial(5) = 120;
      база n <= 1, шаг n → n − 1.

  - layout: image
    title: "Стек вызовов factorial(4)"
    kicker: "Как это работает"
    image: "assets/stack.png"
    caption: "Сначала вызовы идут вниз, затем возвраты — вверх"
    notes: >-
      [проверено 2026-11-07] factorial(4): вызовы 4 → 3 → 2 → 1,
      возвраты 1 → 2 → 6 → 24.

  - layout: steps
    title: "Правила рекурсии"
    kicker: "Чек-лист"
    steps:
      - title: "Найдите базу"
        text: "Условие, при котором функция не вызывает себя."
      - title: "Меняйте параметр"
        text: "Каждый вызов должен приближать к базе."
      - title: "Возвращайте результат"
        text: "Не забывайте return в базе и в шаге."
      - title: "Проверьте на малых n"
        text: "n = 0, 1, 2 — до общего случая."
    notes: >-
      [проверено 2026-11-07] Проверка завершаемости: база достигается,
      параметр монотонно меняется, return есть на каждой ветке.

  - layout: table
    title: "Стоимость рекурсии"
    kicker: "Сложность"
    columns: ["Функция", "Что считает", "Сложность", "Память"]
    column_widths: [1.6, 1.4, 1.2, 1.2]
    rows:
      - ["factorial(n)", "n!", "O(n)", "O(n) стек"]
      - ["fib(n) наивно", "F(n)", "O(2^n)", "O(n) стек"]
      - ["fib(n) с кэшем", "F(n)", "O(n)", "O(n)"]
      - ["Ханойские башни", "2^n − 1 ходов", "O(2^n)", "O(n) стек"]
    notes: >-
      [проверено 2026-11-07] Оценки: factorial — O(n); наивный fib — O(2^n);
      fib с мемоизацией — O(n); глубина стека — O(n).

  - layout: code
    title: "Фибоначчи: наивная рекурсия"
    kicker: "Проблема"
    language: python
    code: |
      def fib(n):
          if n <= 1:                  # база
              return n
          return fib(n - 1) + fib(n - 2)  # два вызова
    note: "Каждый вызов порождает два новых — дерево вызовов быстро растёт."
    notes: >-
      [проверено 2026-11-07] Код запущен: fib(10) = 55; fib(4) = 3,
      но fib(4) делает 9 вызовов, а fib(10) — 177.

  - layout: image
    title: "Дерево вызовов fib(4)"
    kicker: "Наглядно"
    image: "assets/fib-tree.png"
    caption: "F(2) и F(1) вычисляются повторно — отсюда экспоненциальный рост"
    notes: >-
      [проверено 2026-11-07] Наивный fib(4) делает 9 вызовов; повторные
      подзадачи — причина O(2^n).

  - layout: code
    title: "Мемоизация: считаем один раз"
    kicker: "Решение"
    language: python
    code: |
      from functools import lru_cache

      @lru_cache(maxsize=None)
      def fib(n):
          if n <= 1:
              return n
          return fib(n - 1) + fib(n - 2)
    note: "@lru_cache запоминает результаты — повторные вызовы не считаются заново."
    notes: >-
      [проверено 2026-11-07] С lru_cache fib(100) вычисляется мгновенно;
      каждый n считается один раз, сложность O(n).

  - layout: bullets
    title: "Типичные ошибки"
    kicker: "Внимание"
    bullets:
      - text: "Нет базы — RecursionError."
      - text: "Параметр не приближается к базе — бесконечная рекурсия."
      - text: "Забыли return — функция вернёт None."
      - text: "Вызов себя без изменения n — тот же самый вызов."
      - text: "Наивный fib на больших n — экспоненциальный рост."
    note: "Проверка: база + движение к ней + return."
    notes: >-
      [проверено 2026-11-07] Все ошибки приводят к RecursionError, None
      или экспоненциальному времени; проверяются на малых n.

  - layout: two-col
    title: "Рекурсия и цикл"
    kicker: "Сравнение"
    left:
      heading: "Рекурсия"
      bullets:
        - "Короче для деревьев и вложенных структур."
        - "Близка к математическому определению."
        - "Тратит стек; риск RecursionError."
        - "Иногда повторяет вычисления."
    right:
      heading: "Цикл"
      bullets:
        - "Экономит память."
        - "Проще для линейных задач."
        - "Не боится глубины."
        - "Код может быть длиннее."
    notes: >-
      [проверено 2026-11-07] Любую рекурсию можно заменить циклом и явным
      стеком; выбор зависит от структуры задачи и ограничений по памяти.

  - layout: steps
    title: "ЕГЭ: задание 16 — рекурсивные алгоритмы"
    kicker: "Применение"
    steps:
      - title: "Выпишите функции"
        text: "F(n), G(n), базу и все рекуррентные строки."
      - title: "Проверьте базу"
        text: "n = 0, n = 1 — обычно заданы в условии."
      - title: "Трассируйте или кэшируйте"
        text: "Считайте F(2), F(3), … и запоминайте значения."
      - title: "Найдите ответ"
        text: "Значение, число вызовов или вывод программы."
    note: "В действующем каталоге ЕГЭ раздел 16 — «Рекурсивные алгоритмы»; сверьтесь с демоверсией 2026."
    notes: >-
      [проверено 2026-11-07] Каталог заданий ЕГЭ, раздел 16 — «Рекурсивные
      алгоритмы» (inf-ege.sdamgia.ru/prob_catalog). Встречаются функции
      с возвращаемыми значениями и с текстовым выводом. Номера заданий
      сверяйте с демоверсией текущего года.

  - layout: bullets
    title: "Проверьте себя"
    kicker: "Практика"
    bullets:
      - text: "Что вернёт factorial(5)?"
      - text: "Сколько вызовов сделает наивный fib(4)?"
      - text: "Почему fib(30) считается долго?"
      - text: "Как убрать повторные вычисления?"
    note: "Решите в тетради, затем проверим вместе."
    notes: >-
      [проверено 2026-11-07] Ответы: factorial(5) = 120; fib(4) — 9 вызовов;
      fib(30) — экспоненциальный рост; мемоизация через lru_cache или словарь.

  - layout: summary
    title: "Опорный конспект"
    kicker: "Повторение"
    dark: true
    columns:
      - heading: "Понятия"
        items:
          - "Рекурсия — функция вызывает себя."
          - "База — условие выхода."
          - "Шаг — параметр движется к базе."
      - heading: "Код"
        items:
          - "def имя(параметры): return."
          - "factorial: n * factorial(n − 1)."
          - "fib: два вызова, с кэшем — один."
      - heading: "ЕГЭ"
        items:
          - "Задание 16 — рекурсивные алгоритмы."
          - "Считайте базу, затем F(2), F(3), …"
          - "Повторные вызовы — кэшируйте."
    note: "База + изменение параметра + return = рабочая рекурсия."
    notes: >-
      [проверено 2026-11-07] Формулы и оценки проверены запуском кода;
      номер задания сверен с каталогом ЕГЭ.
