# ============================================================
#  Пример: алгебра логики, 8 класс
#  Сборка: python3 scripts/build.py decks/01-algebra-logiki-8-klass
# ============================================================

meta:
  title: "Алгебра логики"
  subtitle: "Высказывания, операции и таблицы истинности"
  subject: "Информатика"
  audience: school
  org: "8 класс"
  date: "2026"
  formats: [pdf]
  slug: "algebra-logiki-8-klass"

slides:
  - layout: title

  - layout: bullets
    title: "Что такое высказывание"
    kicker: "Определение"
    lead: "Высказывание — это предложение, про которое можно однозначно сказать: истинно оно или ложно."
    bullets:
      - text: "«Москва — столица России» — истинное высказывание."
      - text: "«2 + 2 = 5» — ложное высказывание."
      - text: "«Который час?» — не высказывание: это вопрос."
      - text: "«Закрой окно!» — не высказывание: это команда."
      - text: "Истину обозначают 1, ложь — 0."
    note: "Одно и то же предложение может стать истинным или ложным в зависимости от обстоятельств."
    notes: >-
      Спросить класс: какие ещё предложения не являются высказываниями? Примеры: «Ура!»,
      «Который час?», «Реши задачу». [проверено 2026-11-06] Вопрос и команда не являются
      высказываниями по определению.

  - layout: cards
    title: "Три базовые операции"
    kicker: "Главное"
    lead: "Любое логическое выражение собирается из трёх операций."
    cards:
      - number: "1"
        title: "НЕ"
        text: "Инверсия: НЕ 0 = 1 и НЕ 1 = 0. Обозначается ¬A."
      - number: "2"
        title: "И"
        text: "Конъюнкция. Истинна, только когда истинны оба: A И B."
      - number: "3"
        title: "ИЛИ"
        text: "Дизъюнкция. Ложна, только когда ложны оба: A ИЛИ B."
    notes: >-
      Показать связь с жизнью: «на улице дождь И холодно», «в кино ИЛИ дома».
      [проверено 2026-11-06] Таблицы НЕ/И/ИЛИ проверены перебором A, B ∈ {0,1}.

  - layout: image
    title: "Инверсия: прямой и инверсный ключ"
    kicker: "Схема"
    image: "assets/logic.png"
    caption: "При A = 1 прямой ключ замкнут, инверсный ¬A разомкнут — лампа горит только через прямой ключ"
    notes: >-
      Обсудить: что изменится при A = 0? Прямой ключ разомкнётся, инверсный замкнётся,
      и лампа загорится через него. [проверено 2026-11-06] Состояния ключей проверены
      по схеме: A = 1 → прямой замкнут, ¬A разомкнут.

  - layout: table
    title: "Таблица истинности для И и ИЛИ"
    kicker: "Сравнение"
    columns: ["A", "B", "A И B", "A ИЛИ B"]
    column_widths: [1.0, 1.0, 1.5, 1.5]
    rows:
      - ["0", "0", "0", "0"]
      - ["0", "1", "0", "1"]
      - ["1", "0", "0", "1"]
      - ["1", "1", "1", "1"]
    notes: >-
      Для двух переменных всегда 4 строки: 2² = 4. Попросить заполнить таблицу для НЕ A.
      [проверено 2026-11-06] Таблица заполнена перебором четырёх наборов A, B.

  - layout: image
    title: "Логические элементы"
    kicker: "Обозначения"
    image: "assets/gates.png"
    caption: "НЕ, И, ИЛИ — так эти операции обозначают на электрических и логических схемах"
    notes: >-
      Обратить внимание: у элемента НЕ на выходе кружок — знак инверсии.
      [проверено 2026-11-06] Значения соответствуют таблицам истинности НЕ/И/ИЛИ.

  - layout: steps
    title: "Как построить таблицу истинности"
    kicker: "Алгоритм"
    steps:
      - title: "Посчитайте переменные"
        text: "Если переменных n, то строк в таблице будет 2ⁿ."
      - title: "Нарисуйте шапку"
        text: "Перечислите переменные и добавьте столбец для результата."
      - title: "Заполните комбинации"
        text: "Переберите все наборы: 00, 01, 10, 11 — без пропусков."
      - title: "Вычислите результат"
        text: "Подставьте значения и запишите в столбец 0 или 1."
    notes: "[проверено 2026-11-06] Для n = 1, 2, 3 число наборов 2, 4, 8 — формула 2ⁿ."

  - layout: two-col
    title: "Словами и символами"
    kicker: "Перевод"
    left:
      heading: "В жизни"
      bullets:
        - "«Возьму зонт, если дождь И холодно»."
        - "«Пойду гулять, если солнечно ИЛИ тепло»."
        - "«Свет не горит, если выключатель НЕ включён»."
    right:
      heading: "В логике"
      bullets:
        - "A И B истинно только при A = 1 и B = 1."
        - "A ИЛИ B ложно только при A = 0 и B = 0."
        - "НЕ A — противоположное значение."
        - "Скобки задают порядок действий, как в арифметике."
    notes: "[проверено 2026-11-06] Формулировки И/ИЛИ/НЕ проверены по таблицам истинности."

  - layout: bullets
    title: "Законы алгебры логики"
    kicker: "Полезно знать"
    lead: "Эти равенства помогают упрощать выражения и проверять рассуждения."
    bullets:
      - text: "Двойное отрицание: НЕ (НЕ A) = A."
      - text: "A И 1 = A; A И 0 = 0."
      - text: "A ИЛИ 0 = A; A ИЛИ 1 = 1."
      - text: "A И (НЕ A) = 0 — противоречие."
      - text: "A ИЛИ (НЕ A) = 1 — закон исключённого третьего."
      - text: "Законы де Моргана: НЕ (A И B) = (НЕ A) ИЛИ (НЕ B)."
    note: "Законы не нужно заучивать все сразу: начните с двойного отрицания и закона исключённого третьего."
    notes: "[проверено 2026-11-06] Законы проверены перебором A ∈ {0,1}."

  - layout: summary
    title: "Опорный конспект"
    kicker: "Повторение"
    dark: true
    columns:
      - heading: "Понятия"
        items:
          - "Высказывание истинно или ложно — третьего не дано."
          - "Истина = 1, ложь = 0."
          - "Для n переменных в таблице 2ⁿ строк."
      - heading: "Операции"
        items:
          - "НЕ A — инверсия: ¬0 = 1, ¬1 = 0."
          - "A И B истинно только при A = 1 и B = 1."
          - "A ИЛИ B ложно только при A = 0 и B = 0."
      - heading: "Формулы"
        items:
          - "НЕ (НЕ A) = A."
          - "A И (НЕ A) = 0; A ИЛИ (НЕ A) = 1."
          - "НЕ (A И B) = (НЕ A) ИЛИ (НЕ B)."
    note: "Инверсный ключ замыкается при A = 0: лампа горит, когда прямой ключ разомкнут."
    notes: >-
      Опорный конспект можно распечатать и раздать ученикам.
      [проверено 2026-11-06] Формулы проверены перебором A ∈ {0,1}.
      Цитата: «Суть математики не в том, чтобы иметь дело с числами и величинами» —
      Джордж Буль, «Законы мышления», 1854 (пер.).
