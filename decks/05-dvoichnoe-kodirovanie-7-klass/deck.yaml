# ============================================================
#  7 класс: двоичное кодирование
#  Сборка: python3 scripts/build.py decks/05-dvoichnoe-kodirovanie-7-klass --formats pdf
# ============================================================

meta:
  title: "Двоичное кодирование"
  subtitle: "Как компьютер хранит текст, числа и изображения"
  subject: "Информатика"
  audience: school
  org: "7 класс"
  grade: 7
  program: "ФРП Информатика. 7–9 классы (углублённый уровень), 2025"
  date: "2026"
  formats: [pdf]
  slug: "dvoichnoe-kodirovanie-7-klass"

slides:
  - layout: title

  - layout: bullets
    title: "Компьютеру хватает двух знаков"
    kicker: "Вход"
    bullets:
      - "Электронике проще всего различать два состояния: есть сигнал и нет сигнала."
      - "Двум состояниям ставятся в соответствие две цифры — 1 и 0."
      - "Любые данные — текст, звук, видео — превращаются в цепочки нулей и единиц."
      - "Такой способ записи называют двоичным кодированием."
    note: "Два знака — как выключатель: включён или выключен."
    notes: >-
      [проверено 2026-11-07] Двоичное кодирование — представление информации
      с помощью двоичного алфавита {0, 1}. Источник: Босова Л. Л.
      «Информатика. 7 класс», раздел «Двоичное кодирование».

  - layout: cards
    title: "Что кодируется нулями и единицами"
    kicker: "Вокруг нас"
    lead: "Внутри компьютера всё превращается в двоичный код."
    cards:
      - number: "1"
        title: "Текст"
        text: "Каждый символ — его номер в кодовой таблице."
      - number: "2"
        title: "Числа"
        text: "Значение записывается нулями и единицами."
      - number: "3"
        title: "Изображение"
        text: "Цвет каждого пикселя записывается числом."
    notes: >-
      [проверено 2026-11-07] Текст, числа и изображения кодируются
      двоичным кодом; источник: Босова Л. Л. «Информатика. 7 класс»,
      раздел «Двоичное кодирование».

  - layout: bullets
    title: "Двоичный алфавит и двоичный код"
    kicker: "Определения"
    bullets:
      - "Двоичный алфавит — два символа: 0 и 1."
      - "Двоичный код — запись информации нулями и единицами."
      - "Длина кода — сколько символов в цепочке."
      - text: "Пример: 1001 — двоичный код длины 4."
        strong: "1001"
    note: "Один разряд двоичного кода называют битом."
    notes: >-
      [проверено 2026-11-07] Бит — один разряд двоичного кода, принимает
      значение 0 или 1. Источник: Босова Л. Л. «Информатика. 7 класс».

  - layout: table
    title: "N бит дают 2^N разных кодов"
    kicker: "Главное правило"
    columns: ["Длина кода N", "Вариантов (2^N)", "Примеры кодов"]
    column_widths: [1.4, 1.2, 2.0]
    rows:
      - ["1", "2", "0, 1"]
      - ["2", "4", "00, 01, 10, 11"]
      - ["3", "8", "000 … 111"]
      - ["4", "16", "0000 … 1111"]
      - ["8", "256", "00000000 … 11111111"]
    note: "8 бит = 256 комбинаций = один байт."
    notes: >-
      [проверено 2026-11-07] Проверено перебором степеней двойки:
      2^1 = 2, 2^2 = 4, 2^3 = 8, 2^4 = 16, 2^8 = 256.

  - layout: bullets
    title: "Бит — минимальная единица информации"
    kicker: "Определение"
    bullets:
      - "Бит — один разряд двоичного кода: 0 или 1."
      - "8 бит образуют байт."
      - "Байт — стандартная «порция» для одного символа текста."
      - "Дальше единицы идут лесенкой: килобайт, мегабайт, гигабайт."
    note: "«Кило» здесь значит 1024, а не 1000."
    notes: >-
      [проверено 2026-11-07] 1 байт = 8 бит; 1 Кбайт = 1024 байта
      (школьная конвенция; в стандарте IEC 80000-13 это КиБ).
      Источники: Босова Л. Л. «Информатика. 7 класс»; IEC 80000-13.

  - layout: table
    title: "Лестница единиц информации"
    kicker: "Единицы"
    columns: ["Единица", "Равна", "В степенях двойки"]
    column_widths: [1.3, 1.5, 1.6]
    rows:
      - ["Бит", "минимальный разряд", "0 или 1"]
      - ["Байт", "8 бит", "2^3 бит"]
      - ["Килобайт", "1024 байта", "2^10 байт"]
      - ["Мегабайт", "1024 Кбайта", "2^20 байт"]
      - ["Гигабайт", "1024 Мбайта", "2^30 байт"]
    notes: >-
      [проверено 2026-11-07] Вычислено: 2^10 = 1024,
      2^20 = 1 048 576, 2^30 = 1 073 741 824.

  - layout: image
    title: "Как компьютер хранит букву"
    kicker: "Текст"
    image: "assets/kod-texta.png"
    caption: "В кодировке Windows-1251 русской «А» соответствует код 192 — он занимает один байт"
    notes: >-
      [проверено 2026-11-07] Проверено запуском: 'А'.encode('cp1251')
      даёт байт 0xC0 = 192 = 11000000 (дв.).

  - layout: steps
    title: "Задача: сколько весит страница текста"
    kicker: "Разбор"
    steps:
      - title: "Считаем символы"
        text: "40 строк × 60 символов = 2 400 символов."
      - title: "Считаем байты"
        text: "Каждый символ — 1 байт, значит 2 400 байт."
      - title: "Переходим к килобайтам"
        text: "2 400 байт ÷ 1 024 ≈ 2,34 Кбайта."
      - title: "Формулируем ответ"
        text: "Страница текста занимает около 2,34 Кбайта."
    notes: >-
      [проверено 2026-11-07] Вычислено: 40 · 60 = 2 400;
      2 400 ÷ 1024 ≈ 2,34. Пробелы и знаки — тоже символы.

  - layout: bullets
    title: "Как закодирована картинка"
    kicker: "Изображение"
    bullets:
      - "Картинка состоит из пикселей — маленьких цветных точек."
      - "Цвет пикселя записывается числом, число — двоичным кодом."
      - "Глубина цвета — сколько бит отведено одному пикселю."
      - text: "1 бит на пиксель — только 2 цвета: чёрный и белый."
        strong: "2 цвета"
      - "8 бит на пиксель — 256 цветов."
    note: "Чем больше глубина цвета, тем больше файл."
    notes: >-
      [проверено 2026-11-07] i бит на пиксель дают 2^i цветов:
      1 бит → 2 цвета, 8 бит → 256 цветов (проверено вычислением).

  - layout: two-col
    title: "Равномерный и неравномерный код"
    kicker: "Коды"
    left:
      heading: "Равномерный"
      bullets:
        - "Все коды одной длины."
        - "Легко делить цепочку на символы."
        - "Символ текста — всегда 8 бит."
    right:
      heading: "Неравномерный"
      bullets:
        - "Коды разной длины."
        - "Частым символам — короткие коды."
        - "Пример: азбука Морзе."
    notes: >-
      [проверено 2026-11-07] Равномерные и неравномерные коды разбираются
      в теме «Кодирование информации»; в неравномерном коде нужны правила
      разделения символов. Азбука Морзе — неравномерный код.
      Источник: Босова Л. Л. «Информатика. 7 класс».

  - layout: bullets
    title: "Частые ошибки"
    kicker: "Внимание"
    bullets:
      - "Путать бит и байт: в байте 8 бит."
      - "Считать, что в килобайте 1000 байт: там 1024."
      - "Забывать, что пробел и запятая — тоже символы."
      - "Читать 1001 как «тысяча один»: это код длины 4."
      - "Считать, что 2 400 байт — это 2,4 Кбайта: делим на 1024, а не на 1000."
    note: "Сначала проверьте единицы, потом считайте."
    notes: >-
      [проверено 2026-11-07] 1 Кбайт = 1024 байта; в объёме текста
      учитываются все символы, включая пробелы.

  - layout: summary
    title: "Опорный конспект"
    kicker: "Повторение"
    dark: true
    columns:
      - heading: "Понятия"
        items:
          - "Двоичный алфавит — 0 и 1."
          - "Двоичный код — запись нулями и единицами."
          - "Бит — один разряд кода."
      - heading: "Единицы"
        items:
          - "1 байт = 8 бит."
          - "1 Кбайт = 1024 байта."
          - "Кбайт → Мбайт → Гбайт: каждый шаг × 1024."
      - heading: "Правила"
        items:
          - "N бит дают 2^N разных кодов."
          - "Символ текста — 1 байт."
          - "i бит на пиксель — 2^i цветов."
    note: "Любая информация в компьютере — последовательность нулей и единиц."
    notes: >-
      [ФРП 7 класс] Раздел «Теоретические основы информатики»: алфавит и
      кодирование, единицы информации. Предметные результаты: оперировать
      понятиями «бит», «байт», «двоичный код»; вычислять длину кода и
      количество комбинаций; оценивать объём текстовых данных.
