meta:
  title: "Алгоритмы сортировки"
  subtitle: "От «пузырька» до быстрой сортировки: как упорядочить данные"
  subject: "Информатика"
  audience: school
  org: "10 класс"
  date: "2026"
  formats: [pdf]
  slug: "algoritmy-sortirovki"

slides:
  - layout: title

  - layout: bullets
    title: "Что такое сортировка"
    kicker: "Определение"
    lead: "Сортировка — это перестановка элементов набора в порядке, заданном правилом сравнения."
    bullets:
      - text: "На входе — последовательность элементов, на выходе — та же последовательность, но упорядоченная."
      - text: "Правило сравнения задаёт порядок: по возрастанию, по убыванию, по ключу (например, по фамилии)."
      - text: "Один и тот же набор можно упорядочить по-разному — всё зависит от ключа."
      - text: "Для чисел ключом обычно служит само значение, для записей — одно из полей."
    note: "Сортировка не создаёт новую информацию — она делает существующую удобной для обработки."
    notes: "Спросить класс: где они встречали сортировку сегодня? Список контактов, лента, таблица оценок."

  - layout: cards
    title: "Где сортировка помогает"
    kicker: "Применение"
    lead: "Упорядоченные данные позволяют применять быстрые алгоритмы поиска и обработки."
    cards:
      - number: "1"
        title: "Быстрый поиск"
        text: "В отсортированном массиве работает бинарный поиск: 1 000 000 элементов проверяются примерно за 20 шагов."
      - number: "2"
        title: "Базы данных"
        text: "Индексы хранят ключи в порядке — запрос находит нужные строки, не перечитывая всю таблицу."
      - number: "3"
        title: "Отчёты и вывод"
        text: "Списки, рейтинги и таблицы становятся читаемыми, когда строки идут по понятному правилу."
    notes: >-
      [проверено 2026-11-06] log2(1 000 000) ≈ 19,93, то есть около 20 шагов
      бинарного поиска.

  - layout: steps
    title: "Сортировка пузырьком: по шагам"
    kicker: "Пример"
    steps:
      - title: "Сравниваем соседей"
        text: "Берём пару a[j] и a[j+1] и проверяем, не нарушен ли порядок."
      - title: "Меняем местами"
        text: "Если левый элемент больше правого — обмениваем их."
      - title: "Идём по массиву"
        text: "За один проход самый большой элемент «всплывает» в конец."
      - title: "Сужаем границу"
        text: "Следующий проход делаем на один элемент короче."
      - title: "Повторяем до порядка"
        text: "Если за проход не было обменов, массив уже отсортирован — останавливаемся."

  - layout: code
    title: "Пузырьковая сортировка на Python"
    kicker: "Код"
    language: python
    code: |
      def bubble_sort(a):
          n = len(a)
          for i in range(n - 1):
              swapped = False
              for j in range(n - 1 - i):
                  if a[j] > a[j + 1]:
                      a[j], a[j + 1] = a[j + 1], a[j]
                      swapped = True
              if not swapped:
                  break
          return a
    note: "Флаг swapped превращает худший случай O(n²) в лучший O(n): уже отсортированный массив проверяется за один проход."
    notes: >-
      [проверено 2026-11-06] Код запущен в CPython 3.13 на 6 наборах, включая
      пустой, один элемент и уже отсортированный массив.

  - layout: image
    title: "Что происходит с массивом"
    kicker: "Наглядно"
    image: "assets/sortirovka.png"
    caption: "Сортировка по возрастанию: тот же набор чисел, но в другом порядке"

  - layout: table
    title: "Сложность популярных алгоритмов"
    kicker: "Сравнение"
    columns: ["Алгоритм", "Лучшая", "Средняя", "Худшая", "Память"]
    column_widths: [1.7, 1.0, 1.0, 1.0, 1.0]
    rows:
      - ["Пузырьковая", "n", "n²", "n²", "1"]
      - ["Вставками", "n", "n²", "n²", "1"]
      - ["Быстрая", "n log n", "n log n", "n²", "log n"]
      - ["Слиянием", "n log n", "n log n", "n log n", "n"]
    notes: >-
      n — число элементов. Память указана дополнительная, сверх самого массива.
      [проверено 2026-11-06] Оценки сложности сверены с учебником и CLRS.

  - layout: two-col
    title: "Простота против скорости"
    kicker: "Выбор алгоритма"
    left:
      heading: "Пузырьковая и вставками"
      bullets:
        - "Короткий и понятный код."
        - "Не требует дополнительной памяти."
        - "Подходят для небольших массивов (до сотен элементов)."
        - "На больших данных становятся слишком медленными."
    right:
      heading: "Быстрая и слиянием"
      bullets:
        - "Работают за O(n log n) на типичных данных."
        - "Быстрая сортировка экономит память."
        - "Сортировка слиянием устойчива и предсказуема."
        - "Код сложнее — нужна аккуратная реализация."
    notes: >-
      [проверено 2026-11-06] Быстрая сортировка: средняя O(n log n), худшая O(n²);
      слияние — O(n log n) во всех случаях.

  - layout: summary
    title: "Опорный конспект"
    kicker: "Повторение"
    dark: true
    columns:
      - heading: "Понятия"
        items:
          - "Сортировка — упорядочивание по правилу сравнения."
          - "Устойчивость: равные элементы сохраняют порядок."
          - "In-place: без дополнительной памяти."
      - heading: "Сложность"
        items:
          - "O(n²): пузырьковая, вставками."
          - "O(n log n): быстрая, слиянием."
          - "Память: O(1) или O(n) в зависимости от алгоритма."
      - heading: "Практика"
        items:
          - "Для больших данных ориентир — O(n log n)."
          - "В Python sorted() использует Timsort."
          - "Выбор зависит от данных, памяти и устойчивости."
    note: "На малых массивах простая сортировка может обогнать быструю из-за меньших накладных расходов."
    notes: >-
      [проверено 2026-11-06] Timsort используется в CPython (Objects/listobject.c);
      оценки сложности сверены с таблицей.
      Цитата: «Преждевременная оптимизация — корень всех зол» — Дональд Кнут, 1974.
