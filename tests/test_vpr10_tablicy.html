<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ВПР. Информатика. Таблицы истинности</title>
<style>
  :root {
    --paper: #f3f6f9; --grid: #e1e8f0; --sheet: #ffffff; --sheet-grid: #eef2f7;
    --ink: #1c2e4a; --ink-soft: #5b6b84; --rule: #ccd6e3;
    --accent: #2557c9; --accent-soft: #e6edfb;
    --inv: #a8326a; --inv-soft: #f8e8ef;
    --ok: #1d8048; --ok-soft: #e2f3e8;
    --bad: #c43131; --bad-soft: #fbe6e4;
    --warn: #9a5b00; --warn-soft: #fff4df;
    --margin: #e7a0a0;
    --f-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
    --f-body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    --f-mono: "JetBrains Mono", "Cascadia Mono", Consolas, "Courier New", monospace;
    --r: 10px; --shadow: 0 6px 18px rgba(20, 35, 60, .07);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .title { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; color: var(--ink); }
  .subtitle { color: var(--ink-soft); font-size: 13.5px; margin: 2px 0 14px; }
  .timer {
    background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 999px;
    font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px;
  }
  .timer.warn { background: var(--bad); }

  .progress-wrap { background: var(--rule); border-radius: 999px; height: 8px; overflow: hidden; }
  .progress-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--inv)); transition: width .3s; }
  .progress-label { margin: 8px 2px 16px; color: var(--ink-soft); font-weight: 600; font-size: 14px; }

  .card {
    position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r);
    padding: 18px 20px 20px 60px; box-shadow: var(--shadow); min-height: 240px;
  }
  .card::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 44px; width: 1px;
    background: var(--margin); opacity: .7; pointer-events: none;
  }
  .task-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .task-num { background: var(--accent); color: #fff; padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; }
  .task-type { color: var(--ink-soft); font-size: 13px; font-weight: 600; }
  .instruction { font-weight: 700; margin: 0 0 8px; font-size: 17px; }
  .text { margin: 0 0 16px; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--rule); border-radius: 8px;
    padding: 11px 13px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .option:hover { border-color: var(--accent); background: var(--accent-soft); }
  .option input { width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; }
  .option span { font-size: 16px; }

  .text-input, .open-input {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px;
    border: 1.5px solid var(--rule); border-radius: 8px; background: var(--sheet);
  }
  .text-input:focus, .open-input:focus, .match-select:focus { outline: none; border-color: var(--accent); }
  .open-input { min-height: 130px; resize: vertical; }
  .match { display: flex; flex-direction: column; gap: 10px; }
  .match-row { display: flex; align-items: center; gap: 12px; }
  .match-left { flex: 1 1 45%; font-weight: 600; }
  .match-select {
    flex: 1 1 50%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1.5px solid var(--rule); border-radius: 8px; background: var(--sheet);
  }

  /* ===== Таблица истинности ===== */
  .legend {
    background: var(--accent-soft); border-radius: 8px; padding: 10px 14px;
    font-size: 14.5px; line-height: 1.45; margin: 0 0 12px; color: var(--ink);
  }
  .expr {
    font-family: var(--f-mono); font-size: 19px; font-weight: 700;
    background: var(--sheet-grid); border: 1px dashed var(--rule); border-radius: 8px;
    padding: 12px 14px; margin: 0 0 12px; overflow-x: auto; white-space: nowrap;
  }
  .table-scroll { overflow: auto; max-height: 460px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
  table.tt { border-collapse: separate; border-spacing: 0; width: 100%; }
  .tt th, .tt td { border-bottom: 1px solid var(--rule); padding: 5px 8px; text-align: center; font-size: 16px; }
  .tt thead th {
    background: var(--accent-soft); position: sticky; top: 0; z-index: 1;
    font-family: var(--f-mono); font-weight: 700; font-size: 16px; border-bottom: 2px solid var(--rule);
  }
  .tt tr:last-child td { border-bottom: none; }
  .tt td.mono { font-family: var(--f-mono); }
  .tt .num { color: var(--ink-soft); font-size: 13px; width: 34px; }
  .tt .th-f { color: var(--inv); }
  .f-cell { padding: 3px 6px !important; background: var(--inv-soft); }
  .f-toggle {
    width: 64px; height: 34px; border-radius: 6px; border: 1.5px dashed var(--rule);
    background: var(--sheet); font-family: var(--f-mono); font-weight: 700; font-size: 17px;
    color: var(--ink-soft); transition: border-color .12s, background .12s;
  }
  .f-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .f-toggle.v0 { border-style: solid; border-color: var(--accent); color: var(--ink); background: #fff; }
  .f-toggle.v1 { border-style: solid; border-color: var(--inv); color: var(--inv); background: #fff; }
  .tt-status { margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--ink-soft); }
  .tt-status.done { color: var(--ok); }
  .tt-help { margin-top: 4px; font-size: 13.5px; color: var(--ink-soft); }
  .tt-result th, .tt-result td { font-size: 14.5px; padding: 4px 6px; }
  .cell-ok { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
  .cell-bad { background: var(--bad-soft); color: var(--bad); font-weight: 700; }
  .mark-ok { color: var(--ok); font-weight: 700; }
  .mark-bad { color: var(--bad); font-weight: 700; }
  .pts { color: var(--ink-soft); font-size: 13px; font-weight: 700; }

  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .btn {
    font: inherit; font-size: 16px; font-weight: 600; padding: 12px 20px; border-radius: 8px;
    border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer;
    transition: border-color .15s, filter .15s, transform .05s;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.07); }
  .btn-submit { width: 100%; margin-top: 14px; background: var(--ok); border-color: var(--ok); color: #fff; font-size: 17px; }
  .btn-submit:hover:not(:disabled) { filter: brightness(1.07); }
  .hint { text-align: center; color: var(--ink-soft); margin-top: 8px; font-size: 13.5px; }

  .results { margin-top: 20px; }
  .summary {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px 22px;
    text-align: center; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .summary .score { font-family: var(--f-display); font-size: 40px; font-weight: 800; color: var(--accent); }
  .summary .grade { font-size: 24px; font-weight: 700; color: var(--accent); }
  .result-item {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px 20px;
    margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .result-item.correct { border-left: 5px solid var(--ok); }
  .result-item.wrong { border-left: 5px solid var(--bad); }
  .result-item.partial { border-left: 5px solid var(--warn); }
  .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; color: #fff; font-weight: 700; font-size: 13px; }
  .badge.ok { background: var(--ok); }
  .badge.no { background: var(--bad); }
  .badge.warn { background: var(--warn); }
  .your, .right { margin: 6px 0; }
  .your b, .right b { color: var(--ink); }
  .explain { color: var(--ink-soft); font-size: 15px; margin-top: 8px; }
  .selfcheck { margin-top: 12px; background: var(--accent-soft); border-radius: 8px; padding: 13px 15px; }
  .selfcheck .mini-btn {
    font: inherit; font-size: 15px; font-weight: 600; padding: 9px 15px; margin: 6px 8px 0 0;
    border-radius: 7px; border: 1px solid var(--rule); background: var(--sheet); cursor: pointer;
  }
  .selfcheck .mini-btn.yes:hover { border-color: var(--ok); color: var(--ok); }
  .selfcheck .mini-btn.no:hover { border-color: var(--bad); color: var(--bad); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="title" id="test-title"></div>
    <div class="timer" id="timer">10:00</div>
  </header>
  <div class="subtitle" id="subtitle"></div>

  <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <div class="progress-label" id="progress-label">Задание 1 из 5</div>

  <main class="card" id="card"></main>

  <div class="nav">
    <button class="btn" id="prev">← Назад</button>
    <button class="btn btn-primary" id="next">Далее →</button>
  </div>

  <button class="btn btn-submit" id="submit" disabled>Сдать тест</button>
  <div class="hint" id="submit-hint">Чтобы сдать тест, ответь на все задания.</div>

  <section class="results" id="results" hidden></section>
</div>

/* Обфускация секретных полей: правильные ответы и пояснения хранятся
   в base64 и декодируются в рантайме, чтобы их не было видно в
   исходном коде (Ctrl+U / DevTools). */
function B64Dec(b64) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  let bin = "";
  b64 = String(b64).replace(/=+$/, "");
  for (let i = 0; i < b64.length; i += 4) {
    const c1 = chars.indexOf(b64[i]);
    const c2 = chars.indexOf(b64[i + 1]);
    const c3 = b64[i + 2] === undefined ? -1 : chars.indexOf(b64[i + 2]);
    const c4 = b64[i + 3] === undefined ? -1 : chars.indexOf(b64[i + 3]);
    bin += String.fromCharCode((c1 << 2) | (c2 >> 4));
    if (c3 !== -1) bin += String.fromCharCode(((c2 & 15) << 4) | (c3 >> 2));
    if (c4 !== -1) bin += String.fromCharCode(((c3 & 3) << 6) | c4);
  }
  const bytes = [];
  for (let i = 0; i < bin.length; i++) bytes.push(bin.charCodeAt(i));
  let str = "";
  let i = 0;
  while (i < bytes.length) {
    const b = bytes[i];
    if (b < 0x80) { str += String.fromCharCode(b); i += 1; }
    else if (b < 0xE0) { str += String.fromCharCode(((b & 0x1F) << 6) | (bytes[i + 1] & 0x3F)); i += 2; }
    else if (b < 0xF0) { str += String.fromCharCode(((b & 0x0F) << 12) | ((bytes[i + 1] & 0x3F) << 6) | (bytes[i + 2] & 0x3F)); i += 3; }
    else { str += String.fromCharCode(((b & 0x07) << 18) | ((bytes[i + 1] & 0x3F) << 12) | ((bytes[i + 2] & 0x3F) << 6) | (bytes[i + 3] & 0x3F)); i += 4; }
  }
  return str;
}

function decodeSecrets() {
  TEST.tasks.forEach(t => {
    if (typeof t.correct === "string") {
      const raw = B64Dec(t.correct);
      t.correct = t.type === "multi" ? JSON.parse(raw) : (t.type === "truth" ? raw : Number(raw));
    }
    if (typeof t.correctText === "string") t.correctText = B64Dec(t.correctText);
    if (Array.isArray(t.accept)) t.accept = t.accept.map(x => B64Dec(x));
    if (typeof t.sample === "string") t.sample = B64Dec(t.sample);
    if (typeof t.explanation === "string") t.explanation = B64Dec(t.explanation);
    if (Array.isArray(t.pairs)) t.pairs.forEach(p => { if (typeof p.correct === "string") p.correct = B64Dec(p.correct); });
  });
}
decodeSecrets();

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ===== Таблица истинности: рендер и ввод ===== */
function truthRows(t) { return 1 << t.vars.length; }

function renderTruth(t) {
  let html = `<div class="legend"><b>${LEGEND}</b>`;
  if (t.impl) html += LEGEND_IMPL;
  html += `</div>`;
  html += `<div class="expr">${t.text}</div>`;
  const n = t.vars.length, rows = 1 << n;
  html += `<div class="table-scroll"><table class="tt"><thead><tr><th class="num">№</th>`;
  t.vars.forEach(v => { html += `<th>${v}</th>`; });
  html += `<th class="th-f">F</th></tr></thead><tbody>`;
  for (let r = 0; r < rows; r++) {
    html += `<tr><td class="num">${r}</td>`;
    for (let k = 0; k < n; k++) html += `<td class="mono">${(r >> (n - 1 - k)) & 1}</td>`;
    html += `<td class="f-cell"><button type="button" class="f-toggle" data-row="${r}" aria-label="Значение F для строки ${r}">·</button></td></tr>`;
  }
  html += `</tbody></table></div>`;
  html += `<div class="tt-status" id="tt-status"></div>`;
  html += `<div class="tt-help">Клик по кнопке в столбце F переключает значение: пусто → 0 → 1 → пусто. Заполните все ${rows} строк.</div>`;
  return html;
}

function setToggle(btn, v) {
  btn.textContent = v === "0" ? "0" : v === "1" ? "1" : "·";
  btn.classList.toggle("v0", v === "0");
  btn.classList.toggle("v1", v === "1");
}

function updateTruthStatus() {
  const t = TEST.tasks[current];
  const el = document.getElementById("tt-status");
  if (!el) return;
  const rows = truthRows(t);
  const arr = answers[current];
  const filled = Array.isArray(arr) ? arr.filter(v => v === "0" || v === "1").length : 0;
  if (filled === rows) { el.textContent = `Заполнено строк: ${rows} из ${rows} — всё готово.`; el.classList.add("done"); }
  else { el.textContent = `Заполнено строк: ${filled} из ${rows}.`; el.classList.remove("done"); }
}

function bindTruth() {
  const t = TEST.tasks[current];
  if (t.type !== "truth") return;
  card.querySelectorAll(".f-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const r = Number(btn.dataset.row);
      if (!Array.isArray(answers[current])) answers[current] = new Array(truthRows(t)).fill(null);
      const arr = answers[current];
      arr[r] = arr[r] === null ? "0" : (arr[r] === "0" ? "1" : null);
      setToggle(btn, arr[r]);
      updateTruthStatus();
      updateNav();
    });
  });
  updateTruthStatus();
}

function render() {
  const t = TEST.tasks[current];
  let html = `<div class="task-head"><span class="task-num">Задание ${current + 1}</span><span class="task-type">${typeLabel(t.type)}</span></div>`;
  html += `<p class="instruction">${t.instruction}</p>`;
  if (t.type === "truth") {
    html += renderTruth(t);
  } else {
    if (t.text) html += `<p class="text">${t.text}</p>`;
    if (t.type === "single") {
      html += `<div class="options">`;
      t.options.forEach((o, idx) => {
        html += `<label class="option"><input type="radio" name="q" value="${idx}"><span>${o}</span></label>`;
      });
      html += `</div>`;
    } else if (t.type === "multi") {
      html += `<div class="options">`;
      t.options.forEach((o, idx) => {
        html += `<label class="option"><input type="checkbox" name="q" value="${idx}"><span>${o}</span></label>`;
      });
      html += `</div>`;
    } else if (t.type === "text") {
      html += `<input type="text" class="text-input" placeholder="Введи ответ">`;
    } else if (t.type === "match") {
      html += `<div class="match">`;
      t.pairs.forEach((p, idx) => {
        html += `<div class="match-row"><span class="match-left">${p.left}</span><select class="match-select" data-pair="${idx}"><option value="">— выбери —</option>`;
        p.options.forEach(o => { html += `<option value="${o}">${o}</option>`; });
        html += `</select></div>`;
      });
      html += `</div>`;
    } else if (t.type === "open") {
      html += `<textarea class="open-input" placeholder="Напиши ответ"></textarea>`;
    }
  }
  card.innerHTML = html;
  restore();
  bindTruth();
  updateNav();
}

function collect() {
  const t = TEST.tasks[current];
  if (t.type === "truth") return Array.isArray(answers[current]) ? answers[current] : null;
  if (t.type === "single") { const r = card.querySelector('input[type=radio]:checked'); return r ? Number(r.value) : null; }
  if (t.type === "multi") { const a = []; card.querySelectorAll('input[type=checkbox]:checked').forEach(c => a.push(Number(c.value))); return a; }
  if (t.type === "text") return card.querySelector('.text-input').value.trim();
  if (t.type === "match") { const a = []; card.querySelectorAll('.match-select').forEach(s => a.push(s.value)); return a; }
  if (t.type === "open") return card.querySelector('.open-input').value.trim();
  return null;
}

function restore() {
  const a = answers[current];
  const t = TEST.tasks[current];
  if (a === null) return;
  if (t.type === "truth") {
    const arr = Array.isArray(a) ? a : null;
    card.querySelectorAll(".f-toggle").forEach(btn => setToggle(btn, arr ? arr[Number(btn.dataset.row)] : null));
    return;
  }
  if (t.type === "single") { const r = card.querySelector(`input[value="${a}"]`); if (r) r.checked = true; }
  else if (t.type === "multi") { card.querySelectorAll('input[type=checkbox]').forEach(c => { c.checked = a.includes(Number(c.value)); }); }
  else if (t.type === "text") { card.querySelector('.text-input').value = a; }
  else if (t.type === "match") { card.querySelectorAll('.match-select').forEach((s, idx) => { s.value = a[idx] || ""; }); }
  else if (t.type === "open") { card.querySelector('.open-input').value = a; }
}

function isAnswered(a, t) {
  if (a === null || a === undefined) return false;
  if (t.type === "truth") return Array.isArray(a) && a.length === truthRows(t) && a.every(v => v === "0" || v === "1");
  if (t.type === "multi") return Array.isArray(a) && a.length > 0;
  if (t.type === "match") return Array.isArray(a) && a.length === t.pairs.length && a.every(v => v !== "");
  return String(a).trim() !== "";
}

function isCorrect(a, t) {
  if (t.type === "single") return a === t.correct;
  if (t.type === "multi") return JSON.stringify([...a].sort()) === JSON.stringify([...t.correct].sort());
  if (t.type === "text") {
    const norm = String(a).toLowerCase().replace(/\s+/g, " ").trim();
    const accepted = [t.correctText, ...(t.accept || [])].map(x => String(x).toLowerCase().replace(/\s+/g, " ").trim());
    return accepted.includes(norm);
  }
  if (t.type === "match") return Array.isArray(a) && a.every((v, idx) => v === t.pairs[idx].correct);
  return false;
}

function answeredCount() { return TEST.tasks.filter((t, i) => isAnswered(answers[i], t)).length; }

function updateNav() {
  prevBtn.disabled = current === 0;
  nextBtn.hidden = current === TEST.tasks.length - 1;
  progressLabel.textContent = `Задание ${current + 1} из ${TEST.tasks.length}`;
  progressBar.style.width = `${(answeredCount() / TEST.tasks.length) * 100}%`;
  const remaining = TEST.tasks.length - answeredCount();
  if (remaining === 0) { submitBtn.disabled = false; submitHint.textContent = "Все задания отвечены — можно сдавать тест."; }
  else { submitBtn.disabled = true; submitHint.textContent = `Чтобы сдать тест, ответь ещё на ${remaining} ${plural(remaining)}.`; }
}

function plural(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return "задание";
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return "задания";
  return "заданий";
}

function fmt(sec) { const m = Math.floor(sec / 60); const s = sec % 60; return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; }

function startTimer() {
  timerEl.textContent = fmt(timeLeft);
  timerId = setInterval(() => {
    timeLeft--;
    timerEl.textContent = fmt(timeLeft);
    if (timeLeft <= 60) timerEl.classList.add("warn");
    if (timeLeft <= 0) { clearInterval(timerId); submit(); }
  }, 1000);
}

function formatYour(a, t) {
  if (a === null || a === undefined) return "—";
  if (t.type === "truth") return Array.isArray(a) ? `F = ${a.map(v => v === "0" || v === "1" ? v : "·").join("")}` : "—";
  if (t.type === "single") return t.options[a] ?? "—";
  if (t.type === "multi") return a.length ? a.map(i => t.options[i]).join(", ") : "—";
  if (t.type === "match") return a.map((v, i) => `${t.pairs[i].left} → ${v || "—"}`).join("; ");
  return String(a);
}

function formatRight(t) {
  if (t.type === "truth") return `F = ${t.correct}`;
  if (t.type === "single") return t.options[t.correct];
  if (t.type === "multi") return t.correct.map(i => t.options[i]).join(", ");
  if (t.type === "text") return t.correctText;
  if (t.type === "match") return t.pairs.map(p => `${p.left} → ${p.correct}`).join("; ");
  return "См. образец ответа";
}

function openIndices() { return TEST.tasks.map((t, i) => t.type === "open" ? i : -1).filter(i => i >= 0); }

/* ===== Скоринг: таблица истинности — 2/1/0 балла ===== */
function truthErrors(a, t) {
  let e = 0;
  for (let r = 0; r < t.correct.length; r++) {
    if (!Array.isArray(a) || a[r] !== t.correct[r]) e++;
  }
  return e;
}

function taskPoints(t, i) {
  if (t.type === "truth") { const e = truthErrors(answers[i], t); return e === 0 ? 2 : (e === 1 ? 1 : 0); }
  if (t.type === "open") return selfChecked[i] ? 1 : 0;
  return isCorrect(answers[i], t) ? 1 : 0;
}

function computeScore() { return TEST.tasks.reduce((s, t, i) => s + taskPoints(t, i), 0); }
function maxScore() { return TEST.tasks.reduce((s, t) => s + (t.type === "truth" ? 2 : 1), 0); }

function grade(n) { if (n >= 9) return "5"; if (n >= 7) return "4"; if (n >= 5) return "3"; return "2"; }

function truthResultTable(t, a) {
  const n = t.vars.length, rows = 1 << n;
  let html = `<div class="table-scroll"><table class="tt tt-result"><thead><tr><th class="num">№</th>`;
  t.vars.forEach(v => { html += `<th>${v}</th>`; });
  html += `<th>F: твой</th><th>F: верно</th><th>Итог</th></tr></thead><tbody>`;
  for (let r = 0; r < rows; r++) {
    const mine = Array.isArray(a) ? a[r] : null;
    const ok = mine === t.correct[r];
    html += `<tr><td class="num">${r}</td>`;
    for (let k = 0; k < n; k++) html += `<td class="mono">${(r >> (n - 1 - k)) & 1}</td>`;
    html += `<td class="mono ${ok ? "cell-ok" : "cell-bad"}">${mine === "0" || mine === "1" ? mine : "—"}</td>`;
    html += `<td class="mono">${t.correct[r]}</td>`;
    html += `<td class="${ok ? "mark-ok" : "mark-bad"}">${ok ? "✓" : "✗"}</td></tr>`;
  }
  html += `</tbody></table></div>`;
  return html;
}

function renderResults() {
  const total = maxScore();
  const score = computeScore();
  let html = `<div class="summary">`;
  html += `<div class="score">${score} из ${total} баллов</div>`;
  html += `<div class="grade">Оценка: ${grade(score)}</div>`;
  html += `<button class="btn btn-primary" id="retake" style="margin-top:14px">Пройти заново</button>`;
  html += `</div>`;

  TEST.tasks.forEach((t, i) => {
    const isOpen = t.type === "open";
    let ok, pts, cls, badgeTxt, badgeCls;
    if (t.type === "truth") {
      const e = truthErrors(answers[i], t);
      pts = taskPoints(t, i);
      ok = e === 0;
      cls = pts === 2 ? "correct" : pts === 1 ? "partial" : "wrong";
      badgeTxt = e === 0 ? "Верно — 2 балла" : e === 1 ? "1 ошибка — 1 балл" : `Ошибок: ${e} — 0 баллов`;
      badgeCls = e === 0 ? "ok" : e === 1 ? "warn" : "no";
    } else {
      ok = !isOpen && isCorrect(answers[i], t);
      pts = taskPoints(t, i);
      cls = isOpen ? (selfChecked[i] === true ? "correct" : "") : (ok ? "correct" : "wrong");
      badgeTxt = isOpen ? (selfChecked[i] ? "Самопроверка: верно" : "Самопроверка: нет") : (ok ? "Верно" : "Неверно");
      badgeCls = (isOpen ? selfChecked[i] === true : ok) ? "ok" : "no";
    }
    html += `<div class="result-item ${cls}">`;
    html += `<div class="task-head"><span class="task-num">Задание ${i + 1}</span><span class="task-type">${typeLabel(t.type)}</span>`;
    html += `<span class="badge ${badgeCls}">${badgeTxt}</span><span class="pts">${pts} из ${t.type === "truth" ? 2 : 1} балл(ов)</span>`;
    html += `</div>`;
    html += `<p class="instruction">${t.instruction}</p>`;
    if (t.type === "truth") {
      html += `<div class="expr">${t.text}</div>`;
    } else if (t.text) {
      html += `<p class="text">${t.text}</p>`;
    }
    html += `<p class="your"><b>Твой ответ:</b> ${formatYour(answers[i], t)}</p>`;
    html += `<p class="right"><b>Правильный ответ:</b> ${formatRight(t)}</p>`;
    if (t.type === "truth") {
      html += truthResultTable(t, answers[i]);
    }
    if (isOpen) {
      html += `<p class="right"><b>Образец:</b> ${t.sample}</p>`;
      html += `<div class="selfcheck" data-task="${i}">`;
      html += `<p style="margin:0 0 6px"><b>Самопроверка:</b> твой ответ соответствует образцу по смыслу?</p>`;
      html += `<button class="mini-btn yes" data-val="1">Да, соответствует</button>`;
      html += `<button class="mini-btn no" data-val="0">Нет, не соответствует</button>`;
      html += `</div>`;
    }
    html += `<p class="explain">${t.explanation}</p>`;
    html += `</div>`;
  });
  resultsEl.innerHTML = html;
  resultsEl.querySelectorAll(".selfcheck .mini-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.closest(".selfcheck").dataset.task);
      selfChecked[idx] = btn.dataset.val === "1";
      renderResults();
    });
  });
  const retake = resultsEl.querySelector("#retake");
  if (retake) retake.addEventListener("click", () => location.reload());
}

function submit() {
  if (submitted) return;
  submitted = true;
  clearInterval(timerId);
  document.getElementById("card").hidden = true;
  document.querySelector(".nav").hidden = true;
  submitBtn.hidden = true;
  submitHint.hidden = true;
  resultsEl.hidden = false;
  renderResults();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

card.addEventListener("change", () => { answers[current] = collect(); updateNav(); });
card.addEventListener("input", () => { answers[current] = collect(); updateNav(); });
prevBtn.addEventListener("click", () => { if (current > 0) { current--; render(); } });
nextBtn.addEventListener("click", () => { if (current < TEST.tasks.length - 1) { current++; render(); } });
submitBtn.addEventListener("click", submit);

render();
startTimer();
</script>
</body>
</html>
