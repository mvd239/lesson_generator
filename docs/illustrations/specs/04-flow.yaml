type: flow
title: "Как работает сортировка пузырьком"
steps:
  - title: "Сравнить"
    text: "a[j] и a[j+1]"
    mono: true
  - title: "Поменять"
    text: "если порядок нарушен"
  - title: "Сдвинуться"
    text: "j += 1"
    mono: true
  - title: "Повторить"
    text: "пока массив не упорядочен"
caption: "Один проход «поднимает» самый большой элемент в конец"
