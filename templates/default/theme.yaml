# ============================================================
#  ШАБЛОН ОФОРМЛЕНИЯ
#  Это единственное место, где задаются цвета, шрифты и логотип.
#  Изменения здесь автоматически попадают в PPTX, PDF и HTML.
#  После правки цветов пересоберите шаблон:
#      python3 scripts/build.py --refresh-template
# ============================================================

name: "Учебный / по умолчанию"

# Размер слайда 16:9 (в дюймах). Менять не рекомендуется.
slide:
  width: 13.333
  height: 7.5

colors:
  primary:      "#12305B"   # основной: заголовки, титул, разделители
  primary_dark: "#0A1D3A"   # затемнённый основной (градиентные подложки)
  accent:       "#0AB2A9"   # акцент: цвет логотипа
  accent_soft:  "#E1F7F5"   # светлая подложка акцента
  ink:          "#16202B"   # основной текст
  muted:        "#5A6B7B"   # второстепенный текст, подписи
  line:         "#D8E1EA"   # линии, рамки таблиц
  surface:      "#FFFFFF"   # фон слайда
  surface_alt:  "#F2F7FB"   # карточки, плашки
  dark_panel:   "#0A1623"   # подложка тёмных иллюстраций
  code_bg:      "#0F2233"   # фон блока кода
  code_text:    "#E6EDF3"   # текст в блоке кода

fonts:
  heading: "Arial"          # заголовки (Arial есть везде, включая Р7/МойОфис)
  body:    "Arial"          # основной текст
  mono:    "Courier New"    # код и моноширинные вставки
  scale:   1.0              # общий коэффициент размера шрифта

background:
  light: "assets/bg-light.png"   # светлый фон: точечная сетка и мягкое свечение
  dark: "assets/bg-dark.png"     # тёмный фон: то же для титула и конспекта

logo:
  file: "assets/logo.png"        # версия для светлых слайдов (PNG, прозрачный фон)
  file_dark: "assets/logo_dark.png"  # версия для тёмных слайдов (белая)
  width: 0.62                    # ширина логотипа на слайде, дюймы

footer: "Информатика"

# Поля слайда (дюймы)
margins:
  left: 0.85
  right: 0.85
  top: 0.55
  bottom: 0.55
